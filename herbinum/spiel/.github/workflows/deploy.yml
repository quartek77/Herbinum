# Lädt bei jedem Push auf main die geänderten Dateien per FTPS zu All-Inkl hoch.
# Secrets im Repository anlegen: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Deploy zu All-Inkl
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /herbinum/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config.php
            dev-testkonto.txt
            README.md
